name: Optimize InSight Local site images

on:
  push:
    branches: [main]
    paths:
      - logo-insight-local.png
      - assets/terrain.webp
      - assets/analyse.webp
      - .github/workflows/optimize-logo.yml

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Produce right-sized images and icon assets
        run: |
          python3 - <<'PY'
          from PIL import Image

          logo = Image.open("logo-insight-local.png").convert("RGBA")
          logo_small = logo.copy()
          logo_small.thumbnail((500, 250), Image.Resampling.LANCZOS)
          logo_small.save("logo-insight-local.webp", "WEBP", quality=85, method=6)

          # Crop the existing circular emblem, not a newly invented brand.
          emblem = logo.crop((0, 90, 690, 780))
          emblem.resize((180, 180), Image.Resampling.LANCZOS).save("apple-touch-icon.png", optimize=True)
          emblem.resize((192, 192), Image.Resampling.LANCZOS).save("icon-192.png", optimize=True)
          emblem.resize((32, 32), Image.Resampling.LANCZOS).save("favicon-32.png", optimize=True)
          emblem.resize((64, 64), Image.Resampling.LANCZOS).save("favicon.ico", sizes=[(16, 16), (32, 32), (48, 48)])
          for name in ["terrain", "analyse"]:
              source = Image.open("assets/" + name + ".webp").convert("RGB")
              source.thumbnail((768, 768), Image.Resampling.LANCZOS)
              source.save("assets/" + name + "-768.webp", "WEBP", quality=80, method=6)
          print("Brand, icons and responsive image widths successfully generated.")
          PY
          ls -lh logo-insight-local.png logo-insight-local.webp favicon.ico favicon-32.png apple-touch-icon.png icon-192.png assets/*.webp
      - name: Save generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo-insight-local.webp apple-touch-icon.png icon-192.png favicon-32.png favicon.ico assets/terrain-768.webp assets/analyse-768.webp
          if ! git diff --cached --quiet; then
            git commit -m "Generate small brand icons and responsive WebP images"
            git push origin HEAD:main
          else
            echo "Generated files are already current"
          fi
