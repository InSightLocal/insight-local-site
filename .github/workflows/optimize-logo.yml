name: Optimize InSight Local brand image

on:
  push:
    branches: [main]
    paths:
      - logo-insight-local.png
      - .github/workflows/optimize-logo.yml

permissions:
  contents: write

jobs:
  create-optimized-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare imaging library
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Create responsive WebP logo
        run: |
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("logo-insight-local.png").convert("RGBA")
          image.thumbnail((500, 250), Image.Resampling.LANCZOS)
          image.save("logo-insight-local.webp", "WEBP", quality=85, method=6)
          print("Optimized logo:", image.size)
          PY
          ls -lh logo-insight-local.png logo-insight-local.webp
      - name: Publish optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo-insight-local.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize InSight Local logo for web (WebP)"
            git push origin HEAD:main
          else
            echo "WebP already current"
          fi
